name: Sync Knowledge Base

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout indexer repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: pnpm build

      - name: Run Knowledge Base Sync
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          CF_KNOWBASE_API_URL: ${{ secrets.CF_KNOWBASE_API_URL }}
          CF_KNOWBASE_API_TOKEN: ${{ secrets.CF_KNOWBASE_API_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: node dist/index.js
