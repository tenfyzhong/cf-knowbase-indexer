name: Sync Knowledge Base

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout indexer repository
        uses: actions/checkout@v4

      - name: Setup SSH Keys for Private Repositories
        uses: webfactory/ssh-agent@v0.9.0
        if: "${{ env.SSH_KEY != '' }}"
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: pnpm build

      - name: Run Knowledge Base Sync
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_VECTORIZE_INDEX_NAME: ${{ secrets.CLOUDFLARE_VECTORIZE_INDEX_NAME }}
          CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL || '@cf/baai/bge-base-en-v1.5' }}
        run: node dist/index.js
